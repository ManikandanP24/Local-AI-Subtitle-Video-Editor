services:
  - type: web
    name: localsubs-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: WHISPER_MODEL
        value: tiny
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: CORS_ORIGINS
        value: https://localsubs-frontend.onrender.com
    disk:
      name: localsubs-data
      mountPath: /var/data
      sizeGB: 5
  - type: web
    name: localsubs-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
